    <style>
        :root {
            --primary: #0f3875;
            --primary-hover: #0a2550;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --secondary: #475569;
            --secondary-hover: #334155;
            --danger: #dc2626;
            --success: #16a34a;
            --warning: #eab308;
            --bg-main: #f0f4f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --shadow-sm: 0 1px 3px rgba(15, 56, 117, 0.08);
            --shadow-md: 0 4px 12px rgba(15, 56, 117, 0.12);

            --radius: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        #app { max-width: 1000px; margin: 0 auto; padding: 20px; width: 100%; flex: 1; }

        .guru-bar {
            display: flex;
            justify-content: flex-end;
            padding: 12px 24px;
            background: var(--primary);
            border-bottom: 3px solid var(--accent);
            box-shadow: var(--shadow-sm);
        }

        .btn-guru {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s;
        }
        .btn-guru:hover { background: var(--accent-hover); color: #fff; }

        .school-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .school-logo {
            width: 55px;
            height: 55px;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.2));
        }

        .screen { display: none; animation: fadeIn 0.3s ease-in-out; }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 28px;
            box-shadow: var(--shadow-md);
            margin-bottom: 20px;
        }

        .start-card {
            max-width: 480px;
            margin: 30px auto;
            text-align: center;
            border-top: 5px solid var(--primary);
        }

        h1 { font-size: 22px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
        .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(15, 56, 117, 0.25);
        }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-1px); }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-secondary:hover { background-color: #cbd5e1; }

        input[type="text"], select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-main);
            background-color: #ffffff;
            outline: none;
            margin-top: 4px;
        }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 56, 117, 0.15); }

        .exam-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary);
            color: white;
            padding: 16px 24px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            border-bottom: 3px solid var(--accent);
        }

        .exam-timer {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            background: var(--danger);
            padding: 6px 16px;
            border-radius: 20px;
        }

        .exam-body { display: grid; grid-template-columns: 1fr 260px; gap: 20px; }
        @media (max-width: 768px) { .exam-body { grid-template-columns: 1fr; } }

        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .option-item:hover { background-color: #f1f5f9; }

        .q-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .q-grid-btn {
            padding: 10px 0;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
        }
        .q-grid-btn.answered { background: var(--primary); color: white; border-color: var(--primary); }
        .q-grid-btn.current { border: 2px solid var(--accent); font-weight: bold; }

        /* PANEL GURU */
        .guru-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
        .guru-tools { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
        .guru-tools select, .guru-tools input[type="text"] { width:auto; min-width:150px; margin-top:0; }
        .guru-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
        @media (max-width:768px) { .guru-stats { grid-template-columns:repeat(2,1fr); } }
        .stat-box { background:#f1f5f9; border-radius:8px; padding:12px; text-align:center; }
        .stat-box b { display:block; font-size:22px; color:var(--primary); }
        .stat-box span { font-size:12px; color:var(--text-muted); }
        .table-wrap { overflow-x:auto; }
        table.result-table { width:100%; border-collapse:collapse; font-size:13px; }
        .result-table th { background:var(--primary); color:#fff; padding:10px; text-align:left; }
        .result-table td { padding:9px 10px; border-bottom:1px solid var(--border-color); }
        .result-table tr:hover td { background:#f8fafc; }
        .btn-danger-sm { background:var(--danger); color:#fff; border:none; border-radius:6px; padding:5px 10px; cursor:pointer; font-size:12px; }
        .btn-sm { width:auto; padding:9px 16px; font-size:13px; }
    </style>
</head>

  // BANK SOAL BIOLOGI KELAS XII (30 SOAL ENZIM & METABOLISME)

    { question: "Komponen penyusun enzim yang terdiri atas senyawa protein dinamakan ...", options: ["Koenzim", "Kofaktor", "Apoenzim", "Holoenzim", "Gugus prostetik"], answer: 2 },
    { question: "Enzim bekerja secara spesifik. Hal ini berarti bahwa enzim ...", options: ["Dapat bereaksi dengan segala jenis substrat", "Hanya dapat bekerja pada pH tinggi", "Hanya dapat bekerja pada substrat tertentu", "Bekerja dua arah pada substrat yang sama", "Membutuhkan energi tinggi untuk bereaksi"], answer: 2 },
    { question: "Sifat enzim sebagai biokatalisator berarti bahwa enzim ...", options: ["Menghasilkan energi reaksi", "Mempercepat reaksi tanpa ikut bereaksi", "Mengubah arah reaksi kimia", "Hanya bekerja dalam suhu dingin", "Berubah struktur setelah reaksi selesai"], answer: 1 },
    { question: "Teori kerja enzim 'Lock and Key' menegaskan bahwa ...", options: ["Sisi aktif enzim bersifat fleksibel", "Substrat menyesuaikan bentuk dengan enzim", "Sisi aktif enzim bersifat kaku dan spesifik", "Enzim berubah bentuk saat mengikat substrat", "Bentuk enzim selalu berubah-ubah"], answer: 2 },
    { question: "Inhibitor kompetitif menghambat kerja enzim dengan cara ...", options: ["Merusak sisi aktif enzim secara permanen", "Mengikat sisi alosterik enzim", "Bersaing dengan substrat menempati sisi aktif", "Mengubah suhu lingkungan reaksi", "Menggumpalkan molekul enzim"], answer: 2 },
    { question: "Proses pemecahan molekul kompleks menjadi molekul yang lebih sederhana dinamakan ...", options: ["Anabolisme", "Katabolisme", "Asimilasi", "Sintesis", "Kemosintesis"], answer: 1 },
    { question: "Tahapan glikolisis berlangsung di dalam sel pada bagian ...", options: ["Matriks mitokondria", "Krista mitokondria", "Sitosol / Sitoplasma", "Membran luar mitokondria", "Kloroplas"], answer: 2 },
    { question: "Hasil akhir dari proses glikolisis untuk 1 molekul glukosa adalah ...", options: ["2 Asam Piruvat, 2 ATP, 2 NADH", "2 Asetil Ko-A, 2 CO2, 2 NADH", "6 CO2, 6 H2O, 38 ATP", "2 Asam Laktat, 2 ATP", "2 Alkohol, 2 CO2, 2 ATP"], answer: 0 },
    { question: "Tahapan respirasi aerob yang menghasilkan energi ATP terbanyak adalah ...", options: ["Glikolisis", "Dekarboksilasi Oksidatif", "Siklus Krebs", "Transpor Elektron", "Fermentasi"], answer: 3 },
    { question: "Akseptor elektron terakhir dalam rantai transpor elektron respirasi aerob adalah ...", options: ["NADH", "FADH2", "Oksigen (O2)", "Karbon dioksida (CO2)", "Sitokrom"], answer: 2 },
    { question: "Total jumlah ATP bersih yang dihasilkan dari respirasi aerob 1 molekul glukosa adalah ...", options: ["2 ATP", "24 ATP", "34 ATP", "36-38 ATP", "42 ATP"], answer: 3 },
    { question: "Fermentasi alkohol oleh ragi (Saccharomyces) menghasilkan produk akhir berupa ...", options: ["Asam laktat dan O2", "Ethanol, CO2, dan ATP", "Asam piruvat dan H2O", "Asetil Ko-A dan CO2", "Glukosa dan O2"], answer: 1 },
    { question: "Penumpukan zat hasil fermentasi pada sel otot manusia yang menyebabkan pegal adalah ...", options: ["Asam piruvat", "Ethanol", "Asam laktat", "Asetat", "Asetaldehid"], answer: 2 },
    { question: "Reaksi terang fotosintesis terjadi pada organel kloroplas bagian ...", options: ["Stroma", "Membran Tilakoid / Grana", "Membran luar", "Matriks", "Lumen kloroplas"], answer: 1 },
    { question: "Proses fotolisis air pada reaksi terang menghasilkan ...", options: ["Oksigen, elektron, dan ion H+", "Glukosa dan NADPH", "ATP dan CO2", "Asam 3-fosfogliserat (PGA)", "RuBP dan O2"], answer: 0 },
    { question: "Reaksi gelap (Siklus Calvin) fotosintesis berlangsung di bagian ...", options: ["Grana", "Tilakoid", "Stroma", "Krista", "Sitosol"], answer: 2 },
    { question: "Bahan utama dari luar tumbuhan yang difiksasi pada Siklus Calvin adalah ...", options: ["Oksigen (O2)", "Air (H2O)", "Karbon Dioksida (CO2)", "Nitrogen (N2)", "Glukosa"], answer: 2 },
    { question: "Gugus non-protein pada enzim yang berikatan kuat secara kovalen dengan apoenzim disebut ...", options: ["Koenzim", "Gugus prostetik", "Kofaktor ion anorganik", "Holoenzim", "Substrat"], answer: 1 },
    { question: "Teori Induced Fit (ketepatan induksi) menjelaskan bahwa sisi aktif enzim ...", options: ["Kaku dan tidak dapat berubah bentuk", "Memiliki bentuk yang pas hanya sebelum substrat mendekat", "Fleksibel dan dapat menyesuaikan bentuk saat substrat terikat", "Dapat mengikat semua jenis molekul organik", "Akan hancur setelah bereaksi"], answer: 2 },
    { question: "Inhibitor non-kompetitif menghambat kerja enzim dengan cara ...", options: ["Mengikat sisi aktif enzim secara langsung", "Merusak molekul substrat", "Mengikat sisi alosterik sehingga mengubah bentuk sisi aktif", "Menurunkan suhu sistem reaksi", "Mengosongkan kandungan air dalam sel"], answer: 2 },
    { question: "Faktor lingkungan yang dapat menyebabkan enzim mengalami denaturasi adalah ...", options: ["Suhu yang sangat tinggi", "Suhu yang sangat dingin", "Konsentrasi substrat yang berlebih", "Ketersediaan koenzim", "Tekanan udara normal"], answer: 0 },
    { question: "Pada dekarboksilasi oksidatif, 1 molekul asam piruvat diubah menjadi ...", options: ["1 molekul Glukosa", "1 molekul Asetil Ko-A, 1 CO2, dan 1 NADH", "2 molekul ATP dan 2 CO2", "1 molekul Asam Laktat", "1 molekul Citrat"], answer: 1 },
    { question: "Siklus Krebs berlangsung di dalam organel mitokondria tepatnya di bagian ...", options: ["Krista", "Membran luar", "Matriks", "Ruang antar membran", "Stroma"], answer: 2 },
    { question: "Senyawa pertama yang terbentuk pada Siklus Krebs setelah Asetil Ko-A bereaksi dengan Asam Oksaloasetat adalah ...", options: ["Asam Isositrat", "Asam Alfa-Ketoglutarat", "Asam Sitrat", "Asam Suksinat", "Asam Malat"], answer: 2 },
    { question: "Dalam rantai transpor elektron, 1 molekul NADH akan menghasilkan energi setara dengan ...", options: ["1 ATP", "2 ATP", "3 ATP", "4 ATP", "36 ATP"], answer: 2 },
    { question: "Setiap 1 molekul FADH2 yang masuk ke rantai transpor elektron akan menghasilkan energi sebesar ...", options: ["1 ATP", "2 ATP", "3 ATP", "4 ATP", "12 ATP"], answer: 1 },
    { question: "Perbedaan utama antara respirasi aerob dan respirasi anaerob adalah ...", options: ["Respirasi aerob tidak menggunakan glukosa", "Respirasi anaerob menghasilkan ATP lebih banyak", "Respirasi anaerob berlangsung tanpa memerlukan oksigen bebas", "Respirasi aerob terjadi di luar sel", "Respirasi anaerob hanya terjadi pada tumbuhan hijau"], answer: 2 },
    { question: "Fotofosforilasi siklik pada reaksi terang fotosintesis hanya melibatkan ...", options: ["Fotosistem I (P700)", "Fotosistem II (P680)", "Klorofil b saja", "Siklus Calvin", "Enzim Rubisco"], answer: 0 },
    { question: "Senyawa penyerap CO2 pertama kali pada Siklus Calvin fotosintesis adalah ...", options: ["PGA (Asam Fosfogliserat)", "PGAL (Fosfogliseraldehid)", "RuBP (Ribulosa Bifosfat)", "Glukosa", "Asam Sitrat"], answer: 2 },
    { question: "Organel sel yang berperan sebagai tempat berlangsungnya proses respirasi seluler aerob adalah ...", options: ["Kloroplas", "Ribosom", "Mitokondria", "Badan Golgi", "Lisosom"], answer: 2 }
  ];

  let currentQuestionIndex = 0;
  let userAnswers = {};
  let timerInterval = null;
  let timeRemaining = 60 * 60; // 60 Menit (untuk 30 soal)

  function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function startTimer() {
    const timerElement = document.getElementById('examTimer');
    
    timerInterval = setInterval(() => {
      if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        alert("Waktu ujian telah habis! Jawaban Anda akan otomatis dikirim.");
        submitExam();
        return;
      }

      timeRemaining--;
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      
      const formattedMin = String(minutes).padStart(2, '0');
      const formattedSec = String(seconds).padStart(2, '0');
      
      timerElement.innerText = `⏱ ${formattedMin}:${formattedSec}`;
    }, 1000);
  }

  function renderQuestion(index) {
    const q = bankSoalBiologi[index];
    if(!q) return;

    document.getElementById('qNumber').innerText = `Soal ${index + 1} dari ${bankSoalBiologi.length}`;
    document.getElementById('qPrompt').innerText = q.question;

    const answerArea = document.getElementById('answerArea');
    answerArea.innerHTML = '';

    q.options.forEach((opt, optIndex) => {
      const isChecked = userAnswers[index] === optIndex ? 'checked' : '';
      const optDiv = document.createElement('div');
      optDiv.className = 'option-item';
      optDiv.innerHTML = `
        <input type="radio" name="opt_answer" id="opt_${optIndex}" value="${optIndex}" ${isChecked}>
        <label for="opt_${optIndex}" style="cursor:pointer; flex:1;">${String.fromCharCode(65 + optIndex)}. ${opt}</label>
      `;
      
      optDiv.addEventListener('click', () => {
        userAnswers[index] = optIndex;
        renderQuestion(index);
      });

      answerArea.appendChild(optDiv);
    });

    renderGridNav();
  }

  function renderGridNav() {
    const gridContainer = document.getElementById('qGrid');
    gridContainer.innerHTML = '';

    bankSoalBiologi.forEach((_, idx) => {
      const btn = document.createElement('button');
      btn.className = 'q-grid-btn';
      btn.innerText = idx + 1;

      if (userAnswers[idx] !== undefined) btn.classList.add('answered');
      if (idx === currentQuestionIndex) btn.classList.add('current');

      btn.addEventListener('click', () => {
        currentQuestionIndex = idx;
        renderQuestion(currentQuestionIndex);
      });

      gridContainer.appendChild(btn);
    });
  }

  async function submitExam() {
    clearInterval(timerInterval);
    let score = 0;
    const totalQuestions = bankSoalBiologi.length;

    bankSoalBiologi.forEach((q, idx) => {
      if (userAnswers[idx] === q.answer) score++;
    });

    const finalGrade = Math.round((score / totalQuestions) * 100);
    const studentName = document.getElementById('playerName').value;
    const studentClass = document.getElementById('playerClass').value;

    try {
      await addDoc(collection(db, "cbt_results"), {
        name: studentName,
        class: studentClass,
        score: finalGrade,
        correctAnswers: score,
        totalQuestions: totalQuestions,
        submittedAt: serverTimestamp()
      });
      alert(`Ujian Selesai!\n\nNama: ${studentName}\nKelas: ${studentClass}\nJawaban Benar: ${score} dari ${totalQuestions}\nNilai Akhir: ${finalGrade}`);
    } catch (e) {
      console.error("Error menyimpan hasil: ", e);
      alert(`Ujian selesai!\nNilai Akhir Anda: ${finalGrade}`);
    }

    switchScreen('screen-start');
    location.reload();
  }

  // EVENT LISTENERS
  document.getElementById('btnStart').addEventListener('click', () => {
    const name = document.getElementById('playerName').value.trim();
    if(!name) {
      alert("Harap masukkan nama Anda terlebih dahulu!");
      return;
    }
    const studentClass = document.getElementById('playerClass').value;
    document.getElementById('examPlayerTag').innerText = `${name} (${studentClass})`;
    switchScreen('screen-exam');
    startTimer();
    renderQuestion(0);
  });

  document.getElementById('btnPrev').addEventListener('click', () => {
    if (currentQuestionIndex > 0) {
      currentQuestionIndex--;
      renderQuestion(currentQuestionIndex);
    }
  });

  document.getElementById('btnNextQ').addEventListener('click', () => {
    if (currentQuestionIndex < bankSoalBiologi.length - 1) {
      currentQuestionIndex++;
      renderQuestion(currentQuestionIndex);
    }
  });

  document.getElementById('btnFinishExam').addEventListener('click', () => {
    const totalQuestions = bankSoalBiologi.length;
    const answeredCount = Object.keys(userAnswers).length;

    let confirmMsg = "Apakah Anda yakin ingin menyelesaikan ujian?";
    if (answeredCount < totalQuestions) {
      confirmMsg = `Anda baru menjawab ${answeredCount} dari ${totalQuestions} soal. Yakin ingin menyelesaikan ujian?`;
    }

    if (confirm(confirmMsg)) {
      submitExam();
    }
  });

  // ===== PANEL GURU =====
  const GURU_PASSWORD = "guru123"; // <-- GANTI password ini
  let guruRows = [];
  let screenBeforeGuru = 'screen-start';

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = ts => ts && ts.toDate ? ts.toDate().toLocaleString('id-ID') : '-';

  function getFilteredRows() {
    const cls = document.getElementById('guruFilterClass').value;
    const q = document.getElementById('guruSearch').value.trim().toLowerCase();
    return guruRows.filter(r => (!cls || r.class === cls) && (!q || (r.name || '').toLowerCase().includes(q)));
  }

  function renderGuruTable() {
    const rows = getFilteredRows();
    const tbody = document.getElementById('guruTbody');
    tbody.innerHTML = rows.length ? '' : '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">Belum ada data.</td></tr>';

    rows.forEach((r, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${i + 1}</td><td>${esc(r.name)}</td><td>${esc(r.class)}</td>
        <td>${r.correctAnswers}/${r.totalQuestions}</td><td><b>${r.score}</b></td>
        <td>${fmtDate(r.submittedAt)}</td>
        <td><button class="btn-danger-sm">Hapus</button></td>`;
      tr.querySelector('button').addEventListener('click', async () => {
        if (!confirm(`Hapus hasil ${r.name}?`)) return;
        try {
          await deleteDoc(doc(db, "cbt_results", r.id));
          guruRows = guruRows.filter(x => x.id !== r.id);
          renderGuruTable();
        } catch (e) {
          alert("Gagal menghapus. Periksa aturan (rules) Firestore.\n" + e.message);
        }
      });
      tbody.appendChild(tr);
    });

    const scores = rows.map(r => Number(r.score) || 0);
    document.getElementById('statCount').innerText = rows.length;
    document.getElementById('statAvg').innerText = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : 0;
    document.getElementById('statMax').innerText = scores.length ? Math.max(...scores) : 0;
    document.getElementById('statMin').innerText = scores.length ? Math.min(...scores) : 0;
  }

  async function loadGuruData() {
    const msg = document.getElementById('guruMsg');
    msg.innerText = 'Memuat data...';
    try {
      const snap = await getDocs(query(collection(db, "cbt_results"), orderBy("submittedAt", "desc")));
      guruRows = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      const sel = document.getElementById('guruFilterClass');
      const current = sel.value;
      const classes = [...new Set(guruRows.map(r => r.class).filter(Boolean))].sort();
      sel.innerHTML = '<option value="">Semua Kelas</option>' + classes.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
      sel.value = classes.includes(current) ? current : '';

      msg.innerText = '';
      renderGuruTable();
    } catch (e) {
      console.error(e);
      msg.innerText = 'Gagal memuat data: ' + e.message + ' (cek aturan Firestore agar koleksi "cbt_results" boleh dibaca).';
    }
  }

  document.getElementById('btnOpenGuruPanel').addEventListener('click', () => {
    const pass = prompt("Masukkan password guru:");
    if (pass === null) return;
    if (pass !== GURU_PASSWORD) { alert("Password salah!"); return; }
    const active = document.querySelector('.screen.active');
    if (active && active.id !== 'screen-guru') screenBeforeGuru = active.id;
    switchScreen('screen-guru');
    loadGuruData();
  });

  document.getElementById('btnGuruBack').addEventListener('click', () => switchScreen(screenBeforeGuru));
  document.getElementById('btnGuruRefresh').addEventListener('click', loadGuruData);
  document.getElementById('guruFilterClass').addEventListener('change', renderGuruTable);
  document.getElementById('guruSearch').addEventListener('input', renderGuruTable);

  document.getElementById('btnGuruPdf').addEventListener('click', () => {
    const rows = getFilteredRows();
    if (!rows.length) { alert("Tidak ada data untuk dicetak."); return; }
    if (!window.jspdf) { alert("Pustaka PDF belum termuat. Periksa koneksi internet."); return; }
    const pdf = new window.jspdf.jsPDF();
    const cls = document.getElementById('guruFilterClass').value || 'Semua Kelas';
    pdf.setFontSize(14);
    pdf.text("REKAP NILAI CBT ATS BIOLOGI", 14, 15);
    pdf.setFontSize(10);
    pdf.text("SMA Negeri 1 Jawilan - " + cls, 14, 22);
    pdf.autoTable({
      startY: 28,
      head: [['No', 'Nama', 'Kelas', 'Benar', 'Nilai', 'Waktu Kirim']],
      body: rows.map((r, i) => [i + 1, r.name, r.class, `${r.correctAnswers}/${r.totalQuestions}`, r.score, fmtDate(r.submittedAt)]),
      headStyles: { fillColor: [15, 56, 117] }
    });
    pdf.save(`rekap-nilai-${cls.replace(/\s+/g, '-')}.pdf`);
  });

  document.getElementById('btnGuruCsv').addEventListener('click', () => {
    const rows = getFilteredRows();
    if (!rows.length) { alert("Tidak ada data untuk diekspor."); return; }
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = ['No,Nama,Kelas,Benar,Total,Nilai,Waktu Kirim']
      .concat(rows.map((r, i) => [i + 1, q(r.name), q(r.class), r.correctAnswers, r.totalQuestions, r.score, q(fmtDate(r.submittedAt))].join(',')))
      .join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' }));
    a.download = 'rekap-nilai.csv';
    a.click();
  });
</script>
</body>
</html>
